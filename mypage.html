<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 | AfterScene</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">AfterScene</a>
      <nav class="nav-menu">
        <a href="admin.html" id="adminAddBtn" class="hidden">+ 연극 등록</a>
        <a href="mypage.html" id="myPageBtn">마이페이지</a>
        <a href="#" id="loginBtn">로그인</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <a href="#" class="back-link" id="backLink">← 뒤로가기</a>

    <div class="modal-box mypage-box page-box">
      <h2>마이페이지</h2>
      <p class="mypage-email" id="myPageEmail"></p>

      <div class="mypage-stats">
        <div class="stat-item">
          <div class="stat-number" id="myReviewCount">0</div>
          <div class="stat-label">작성한 후기</div>
        </div>
      </div>

      <div class="taste-stats" id="tasteStats">
        <p class="placeholder-text">불러오는 중...</p>
      </div>

      <h3 class="mypage-section-title">⭐ 팔로우한 배우 · 공연장</h3>
      <div class="my-follow-list" id="myFollowList">
        <p class="placeholder-text">불러오는 중...</p>
      </div>

      <h3 class="mypage-section-title">내가 남긴 후기</h3>
      <div class="my-review-list" id="myReviewList">
        <p class="placeholder-text">불러오는 중...</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 AfterScene. All rights reserved.</p>
    <p class="kopis-credit">본 서비스는 공연예술통합전산망(KOPIS)이 제공하는 공연정보를 활용하였습니다.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/common.js"></script>
  <script src="js/mypage.js"></script>
</body>
</html>
