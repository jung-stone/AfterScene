<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>극장 상세 | AfterScene</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">AfterScene</a>
      <nav class="nav-menu">
        <a href="admin.html" id="adminAddBtn" class="hidden">+ 연극 등록</a>
        <a href="mypage.html" id="myPageBtn">마이페이지</a>
        <a href="#" id="loginBtn">로그인</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <a href="#" class="back-link" id="backLink">← 뒤로가기</a>

    <div class="modal-box mypage-box page-box">
      <h2 id="venueName">극장</h2>
      <button type="button" class="follow-btn hidden" id="followBtn">☆ 팔로우</button>
      <div class="archive-avg-rating" id="venueAvgRating"></div>
      <p class="mypage-email" id="venueBio"></p>

      <div class="admin-bio-edit hidden" id="venueBioEditBox">
        <textarea id="venueBioInput" rows="3" placeholder="극장 소개를 입력하세요"></textarea>
        <button id="venueBioSaveBtn">소개 저장</button>
      </div>

      <h3 class="mypage-section-title">공연된 작품</h3>
      <div class="person-play-list" id="venuePlayList"></div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 AfterScene. All rights reserved.</p>
    <p class="kopis-credit">본 서비스는 공연예술통합전산망(KOPIS)이 제공하는 공연정보를 활용하였습니다.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/common.js"></script>
  <script src="js/venue.js"></script>
</body>
</html>
