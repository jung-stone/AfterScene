<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연극 상세 | AfterScene</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">AfterScene</a>
      <nav class="nav-menu">
        <a href="admin.html" id="adminAddBtn" class="hidden">+ 연극 등록</a>
        <a href="mypage.html" id="myPageBtn">마이페이지</a>
        <a href="#" id="loginBtn">로그인</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <a href="#" class="back-link" id="backLink">← 뒤로가기</a>

    <div class="modal-box mypage-box page-box">
      <div class="page-header-row">
        <h2 id="reviewPlayTitle">연극 제목</h2>
        <button type="button" class="share-btn hidden" id="shareBtn">🔗 공유</button>
      </div>
      <a href="#" class="admin-edit-play-btn hidden" id="adminEditPlayBtn">✏️ 연극 정보 수정</a>
      <div class="play-info-box" id="playInfoBox"></div>
      <button type="button" class="admin-edit-play-btn hidden" id="viewCastScheduleBtn">🗓 캐스팅 일정 보기</button>

      <h3 class="mypage-section-title">✍️ 나의 관람 후기 작성</h3>
      <div class="rating-picker">
        <input type="range" id="ratingInput" min="0.5" max="5" step="0.5" value="3.5" />
        <div class="rating-display">⭐ <span id="ratingValue">3.5</span> / 5.0</div>
      </div>

      <label class="admin-label">관람 회차</label>
      <div id="roundSelectBox" class="round-select-box hidden"></div>

      <div id="manualDateTimeBox">
        <label class="admin-label">관람 날짜</label>
        <input type="date" id="watchedDateInput" />
        <label class="admin-label">관람 시간 (선택)</label>
        <input type="text" id="watchedTimeInput" placeholder="예: 14:00 또는 19:30" />
      </div>
      <label class="admin-label">좌석 (선택)</label>
      <input type="text" id="seatInput" placeholder="예: 1층 A구역 5열 12번" />

      <input type="text" id="oneLineInput" placeholder="한 줄 평을 남겨주세요" maxlength="60" />
      <textarea id="detailInput" placeholder="상세 후기를 자유롭게 작성해주세요" rows="5"></textarea>

      <button class="modal-submit-btn" id="reviewSubmitBtn">후기 등록하기</button>

      <h3 class="mypage-section-title">📝 다른 관람객들의 후기</h3>
      <div class="review-sort-buttons" id="reviewSortButtons">
        <button class="sort-btn active" data-sort="latest">최신순</button>
        <button class="sort-btn" data-sort="likes">좋아요순</button>
      </div>
      <div class="existing-reviews" id="existingReviewsList">
        <p class="placeholder-text">불러오는 중...</p>
      </div>

      <p class="modal-error" id="reviewError"></p>
    </div>
  </main>

  <!-- 후기 댓글 모달 -->
  <div class="modal-overlay" id="commentModal">
    <div class="modal-box mypage-box">
      <button class="modal-close" id="closeCommentModal">&times;</button>
      <div id="commentReviewDetail"></div>

      <h3 class="mypage-section-title">댓글</h3>
      <div class="comment-list" id="commentList"></div>

      <div class="comment-input-row">
        <input type="text" id="commentInput" placeholder="댓글을 입력하세요" maxlength="200" />
        <button id="commentSubmitBtn">등록</button>
      </div>
      <p class="modal-error" id="commentError"></p>
    </div>
  </div>

  <!-- 캐스팅 일정 조회 모달 (누구나 볼 수 있음) -->
  <div class="modal-overlay" id="viewCastScheduleModal">
    <div class="modal-box mypage-box">
      <button class="modal-close" id="closeViewCastScheduleModal">&times;</button>
      <h2>캐스팅 일정</h2>
      <div id="viewCastScheduleList"></div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 AfterScene. All rights reserved.</p>
    <p class="kopis-credit">본 서비스는 공연예술통합전산망(KOPIS)이 제공하는 공연정보를 활용하였습니다.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/common.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
